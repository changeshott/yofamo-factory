<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Yofamo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1B2E; --ink-2:#13243B; --panel:#172B45; --panel-2:#1D3554; --line:#2A4868;
  --text:#ECF2F8; --muted:#97AAC0; --faint:#66809D;
  --circuit:#47B5FF; --signal:#FF9A4D; --leaf:#6FD29A; --weak:#5A7393; --bad:#F07178;
  --pixel:"Pixelify Sans", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--circuit)}
:focus-visible{outline:2px solid var(--circuit);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;background:var(--ink-2);border-bottom:2px solid #08121F}
.hud h1{font:700 22px/1 var(--pixel);margin:0;letter-spacing:.5px}
.hud h1 span{color:var(--signal)}
.greet{color:var(--muted);font-size:14px;margin-top:4px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.stat{display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--muted)}
.stat b{font:700 16px/1 var(--pixel);color:var(--text)}
.stat.warn{border-color:var(--signal)} .stat.warn b{color:var(--signal)}
.stat.good b{color:var(--leaf)}

.stage{position:relative;max-width:1180px;margin:0 auto;padding:10px 12px 0}
.office-wrap{position:relative;width:min(100%, calc((100vh - 190px) * 1.3636));min-width:min(100%, 340px);margin:0 auto;aspect-ratio:450/330;border-radius:10px;overflow:hidden;background:#0B1626;box-shadow:inset 0 0 0 2px #08121F}
canvas#office{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.overlay{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);font:700 11px/1 var(--pixel);padding:3px 6px 2px;border-radius:3px;background:rgba(8,18,31,.82);color:var(--text);white-space:nowrap;letter-spacing:.3px}
.tag.dim{color:#9FB2C8;background:rgba(8,18,31,.55);font-weight:500}
.tag.founder{background:var(--signal);color:#24140A}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#FDFBF6;color:#1A2638;border:2px solid #1A2638;border-radius:6px;padding:4px 8px;font:500 12px/1.2 var(--pixel);white-space:nowrap;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-5px;border:5px solid transparent;border-top-color:#1A2638}
.bubble.ok{background:#E3F8EC}
.bubble.err{background:#FFE6E6}
.badge{position:absolute;transform:translate(-50%,-50%);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font:700 12px/20px var(--pixel);text-align:center;box-shadow:0 0 0 2px #08121F}
.hovertip{position:absolute;transform:translate(-50%,-100%);background:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .1s}
.hovertip.on{opacity:1}

.dock{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 18px;scrollbar-width:thin}
.dock button{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:500 14px/1 var(--pixel)}
.dock button:hover{border-color:var(--circuit)}
.dock .dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.dock .sep{flex:0 0 1px;background:var(--line);margin:4px 2px}
.dock .count{background:var(--bad);color:#fff;border-radius:8px;padding:2px 6px;font-size:11px}

.scrim{position:fixed;inset:0;background:rgba(5,10,18,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--ink-2);border-left:2px solid #08121F;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;z-index:5;visibility:hidden}
.drawer.on{transform:none;visibility:visible}
.drawer header{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{font:700 20px/1.2 var(--pixel);margin:0;flex:1}
.drawer header .close{background:none;border:1px solid var(--line);border-radius:6px;width:34px;height:34px;font-size:18px}
.drawer .body{overflow:auto;padding:16px 18px 40px;flex:1}
.avatar{width:48px;height:48px;image-rendering:pixelated;background:var(--panel);border-radius:8px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.drawer,.scrim,.hovertip{transition:none}}

h3{font:700 16px/1.3 var(--pixel);margin:20px 0 8px;letter-spacing:.3px}
h3:first-child{margin-top:0}
p{margin:0 0 8px}
.msg{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:8px;font:500 14px/1 var(--pixel)}
.btn:hover{border-color:var(--circuit)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#24140A;font-weight:700}
.btn.small{padding:6px 10px;font-size:13px}
.btn.ghost{background:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
input[type=text],select,textarea{background:#0A1526;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}
input[type=text]{width:100%;margin-top:4px}
textarea{width:100%;min-height:440px;font:13px/1.6 Consolas,"Cascadia Mono",monospace;resize:vertical}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:10px 0 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.state-pill{display:inline-block;font:500 12px/1 var(--pixel);padding:4px 8px;border-radius:4px;background:var(--panel-2);color:var(--muted)}
.state-pill.running{background:rgba(255,154,77,.18);color:var(--signal)}
.state-pill.ok{background:rgba(111,210,154,.16);color:var(--leaf)}
.state-pill.error{background:rgba(240,113,120,.16);color:var(--bad)}
pre.log{background:#0A1526;border:1px solid var(--line);border-radius:8px;padding:10px;margin:0;max-height:320px;overflow:auto;font:12.5px/1.5 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-word;color:#C9D6E4}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.list li:first-child{border-top:0}
.list .when{color:var(--faint);white-space:nowrap;font-size:13px}
button.link{background:none;border:0;padding:0;color:var(--circuit);text-align:left}
.progress{height:12px;background:#0A1526;border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--leaf) 0 8px,#5BBE86 8px 10px)}

.vid{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:8px 0}
.vid summary{list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 12px;cursor:pointer}
.vid summary::-webkit-details-marker{display:none}
.vid summary strong{display:block;font-size:14px;line-height:1.3}
.vid summary small{color:var(--faint);font-size:12px}
.vid .chev{color:var(--faint)}
.vid[open] .chev{transform:rotate(90deg)}
.vid-body{padding:0 12px 12px;border-top:1px solid var(--line)}
.vid-body h4{font:500 14px/1.3 var(--pixel);margin:14px 0 6px;color:var(--muted)}
.step{font:500 11px/1 var(--pixel);padding:4px 7px;border-radius:4px;white-space:nowrap;background:var(--panel-2);color:var(--muted)}
.step.ide{background:rgba(255,154,77,.18);color:var(--signal)}
.step.disetujui{background:rgba(71,181,255,.16);color:var(--circuit)}
.step.naskah{background:rgba(111,210,154,.16);color:var(--leaf)}
.step.terbit{background:var(--signal);color:#24140A}
.step.ditolak{text-decoration:line-through;color:var(--faint)}
.hook{font:700 19px/1.2 var(--pixel);color:var(--signal);margin:0 0 4px}
.facts{margin:0;padding-left:18px;font-size:14px}
.facts li{margin:3px 0}
.copy-row{display:flex;gap:8px;align-items:flex-start}
.copy-row .val{flex:1;background:#0A1526;border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;font-size:14px}
.script{margin:0;padding-left:20px;font-size:14px}
.script li{margin:5px 0}
.script li span{display:block;color:var(--faint);font-size:13px}

.chart{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th button{background:none;border:0;padding:0;font-weight:700;color:inherit}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl a{color:var(--text);text-decoration:none}
.tier{font:500 11px/1 var(--pixel);padding:3px 6px;border-radius:3px;white-space:nowrap}
.tier.menang{background:rgba(255,154,77,.18);color:var(--signal)}
.tier.rata-rata{background:rgba(71,181,255,.14);color:var(--circuit)}
.tier.lemah{background:rgba(90,115,147,.3);color:#B9C7D8}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.seg button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--text);border-color:var(--circuit)}

.md{font-size:14px}
.md h1{font:700 18px/1.3 var(--pixel);margin:0 0 8px}
.md h2{font:700 16px/1.3 var(--pixel);margin:18px 0 6px}
.md h3{font-size:15px;margin:14px 0 6px}
.md table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.md th,.md td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.md th{color:var(--muted)}
.md code{background:#0A1526;padding:1px 4px;border-radius:3px}
.md ul,.md ol{padding-left:20px}
.md blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}

.notices{max-width:1180px;margin:0 auto}
.notice{margin:10px 12px 0;padding:10px 14px;border-left:3px solid var(--signal);background:rgba(255,154,77,.08);border-radius:0 6px 6px 0;font-size:14px}
.drawer .notice{margin:0 0 12px}
@media (max-width:700px){
  .hud{padding:10px 12px}
  .stats{margin-left:0}
  .tag{font-size:8px;padding:2px 3px}
  .tag.dim{display:none}
  .bubble{font-size:9px;padding:2px 4px}
}
</style>
</head>
<body>
<header class="hud">
  <div>
    <h1>Studio <span>Yofamo</span></h1>
    <div class="greet" id="greet">Memuat kantor…</div>
  </div>
  <div class="stats" id="stats"></div>
</header>
<div class="notices" id="notices"></div>

<main class="stage">
  <h2 class="sr">Kantor virtual</h2>
  <div class="office-wrap">
    <canvas id="office" width="450" height="330" role="img" aria-label="Kantor virtual Studio Yofamo. Pakai tombol di bawah kantor untuk membuka setiap meja dan papan."></canvas>
    <div class="overlay" id="overlay"></div>
    <div class="hovertip" id="hovertip"></div>
  </div>
  <nav class="dock" id="dock" aria-label="Bagian kantor"></nav>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-labelledby="drawerTitle">
  <header><canvas class="avatar" id="drawerAvatar" width="16" height="16" aria-hidden="true"></canvas><h2 id="drawerTitle">Panel</h2><button class="close" id="drawerClose" aria-label="Tutup panel">×</button></header>
  <div class="body" id="drawerBody"></div>
</aside>

<script>
/* ================= data & helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n == null ? "–" : Number(n).toLocaleString("id-ID");
const dec = n => n == null ? "–" : Number(n).toLocaleString("id-ID",{maximumFractionDigits:2});
const short = n => n >= 1000 ? (n/1000).toLocaleString("id-ID",{maximumFractionDigits:1}) + " rb" : String(Math.round(n));
const cleanTitle = t => String(t).replace(/#\S+/g, "").replace(/\s{2,}/g, " ").trim();
const daysSince = iso => Math.floor((Date.now() - Date.parse(iso + "T00:00:00")) / 864e5);
const localDate = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const when = iso => { if (!iso) return ""; const d = iso.slice(0,10), t = iso.slice(11,16); return d === localDate() ? `hari ini ${t}` : `${d.slice(8,10)}/${d.slice(5,7)} ${t}`; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let weeklyTarget = 3; try { weeklyTarget = +localStorage.getItem("yofamo.target") || 3; } catch {}

async function api(path, opts = {}) {
  const res = await fetch(path, {...opts, headers: {"Content-Type":"application/json","X-Yofamo":"1", ...(opts.headers||{})}});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || data.error || `HTTP ${res.status}`);
  return data;
}

function inline(t){
  return esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(text){
  const L = String(text).replace(/\r/g,"").split("\n"), out = []; let i = 0;
  const cells = l => l.trim().replace(/^\||\|$/g,"").split("|").map(c => c.trim());
  while (i < L.length){
    const l = L[i];
    if (/^```/.test(l)){ const b=[]; i++; while(i<L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out.push(`<pre class="log">${esc(b.join("\n"))}</pre>`); continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/); if (h){ const n=Math.min(h[1].length,3); out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*\|/.test(l) && /^\s*\|?\s*:?-{2,}/.test(L[i+1]||"")){ const hd=cells(l); i+=2; const bd=[]; while(i<L.length && /^\s*\|/.test(L[i])) bd.push(cells(L[i++]));
      out.push(`<table><thead><tr>${hd.map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${bd.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`); continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)){ const ol=/^\s*\d+\./.test(l), it=[]; while(i<L.length && /^\s*([-*]|\d+\.)\s+/.test(L[i])) it.push(L[i++].replace(/^\s*([-*]|\d+\.)\s+/,"")); out.push(`<${ol?"ol":"ul"}>${it.map(x=>`<li>${inline(x)}</li>`).join("")}</${ol?"ol":"ul"}>`); continue; }
    if (/^>\s?/.test(l)){ out.push(`<blockquote>${inline(l.replace(/^>\s?/,""))}</blockquote>`); i++; continue; }
    if (!l.trim()){ i++; continue; }
    const p=[]; while(i<L.length && L[i].trim() && !/^(#{1,4}\s|```|\s*\||\s*([-*]|\d+\.)\s|>)/.test(L[i])) p.push(L[i++]); if(!p.length) p.push(L[i++]);
    out.push(`<p>${inline(p.join(" "))}</p>`);
  }
  return out.join("");
}

/* ================= team ================= */
const TEAM = [
  {id:"steve", key:"steve-analis", job:"steve", name:"Steve", role:"Analis statistik", desk:[2,3],
   look:{skin:"#EFC6A0", hair:"#3A2A1F", shirt:"#47B5FF", pants:"#2C3B57", style:"short"},
   about:"Membaca statistik semua Shorts, menemukan topik dan hook yang menang, lalu menulis laporan mingguan.",
   busy:{steve:"Menganalisis data…", fetch:"Mengambil statistik…"}},
  {id:"nova", key:"ide-riset", job:"ide", name:"Nova", role:"Ide & riset", desk:[5,3],
   look:{skin:"#F3CFB0", hair:"#C8462C", shirt:"#6FD29A", pants:"#3A3550", style:"long"},
   about:"Mencari 3 ide Short dari laporan Steve. Setiap fakta diverifikasi dengan minimal 2 sumber berbeda.",
   busy:{ide:"Riset ide di web…"}},
  {id:"raka", key:"penulis", job:"penulis", name:"Raka", role:"Penulis naskah", desk:[8,3],
   look:{skin:"#C99068", hair:"#151515", shirt:"#FF9A4D", pants:"#2B2B33", style:"cap"},
   about:"Menulis naskah 30–45 detik, judul, teks hook, deskripsi, dan tag dari ide yang kamu setujui.",
   busy:{penulis:"Menulis naskah…"}},
];
const FUTURE = [
  {key:"suara", name:"Suara", role:"TTS + timing kata", desk:[2,7]},
  {key:"aset", name:"Pencari aset", role:"Klip berlisensi", desk:[5,7]},
  {key:"editor-capcut", name:"Editor CapCut", role:"Tulis file draft", desk:[8,7]},
  {key:"upload", name:"Upload", role:"Terbit terjadwal", desk:[11,3]},
];
const FOUNDER = {name:"Zona", desk:[10.6,7.2], look:{skin:"#D9A47E", hair:"#1C1C1C", shirt:"#F4F1E8", pants:"#24324A", style:"short"}};

/* ================= isometric renderer ================= */
const BW = 450, BH = 330, T = 16, OX = 196, OY = 112, RW = 14, RD = 11, WALL = 100;
const cv = $("#office"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const P = (x, y, z = 0) => [Math.round(OX + (x - y) * T), Math.round(OY + (x + y) * T / 2 - z)];
function poly(pts, fill, stroke){ ctx.beginPath(); pts.forEach(([x,y],i) => i ? ctx.lineTo(x,y) : ctx.moveTo(x,y)); ctx.closePath(); if (fill){ ctx.fillStyle = fill; ctx.fill(); } if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); } }
function px(x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function shade(hex, f){ const n = parseInt(hex.slice(1),16); const ch = v => Math.max(0, Math.min(255, Math.round(v * f))); return "#" + ((1<<24) + (ch(n>>16)<<16) + (ch((n>>8)&255)<<8) + ch(n&255)).toString(16).slice(1); }
function box(x, y, w, d, h, color, z = 0){
  const top = [P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)];
  poly([P(x,y+d,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x,y+d,z)], shade(color,.78));
  poly([P(x+w,y,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x+w,y,z)], shade(color,.62));
  poly(top, color);
  return top;
}
const bboxOf = pts => { const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]); return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)]; };
function rng(seed){ let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

function dayPhase(){
  const d = new Date(), h = d.getHours() + d.getMinutes()/60;
  if (h >= 5 && h < 7) return {name:"pagi", sky:["#F7B58A","#9FC4E8"], tint:"rgba(255,170,110,.07)", lamps:false, lit:.15};
  if (h >= 7 && h < 16) return {name:"siang", sky:["#7EC3F2","#CFE8FA"], tint:null, lamps:false, lit:0};
  if (h >= 16 && h < 18.5) return {name:"sore", sky:["#F49B6C","#F6D29B"], tint:"rgba(255,140,80,.09)", lamps:true, lit:.3};
  return {name:"malam", sky:["#0D1630","#26375E"], tint:"rgba(10,18,45,.28)", lamps:true, lit:.65};
}

const SPOTS = [[13.0,1.7],[1.1,5.5],[3.6,1.4],[7.6,5.6],[8.0,1.5],[11.6,6.1],[12.4,5.4]];
const actors = TEAM.map((a, i) => ({...a, x: a.desk[0] + 1, y: a.desk[1] + 1.55, path: [], wait: 25 + i*20, pose: "sit", facing: "back", frame: i*5, mode: "idle", sitIdle: true}));
const founderActor = {...FOUNDER, x: FOUNDER.desk[0] + 1.25, y: FOUNDER.desk[1] + 1.75};
const seatOf = a => [a.desk[0] + 1, a.desk[1] + 1.55];
function planTo(a, [tx, ty]){
  const aisle = 5.6; a.path = [];
  if (Math.abs(a.y - aisle) > .2) a.path.push([a.x, aisle]);
  if (Math.abs(a.x - tx) > .05) a.path.push([tx, aisle]);
  a.path.push([tx, ty]);
  if (reduced){ a.x = tx; a.y = ty; a.path = []; }
}
function stepActor(a, busy){
  a.frame++;
  const seat = seatOf(a);
  if (busy && a.mode !== "work"){ a.mode = "work"; a.sitIdle = true; planTo(a, seat); }
  if (!busy && a.mode === "work"){ a.mode = "idle"; a.wait = 50; }
  if (a.path.length){
    const [tx, ty] = a.path[0], dx = tx - a.x, dy = ty - a.y, dist = Math.hypot(dx, dy), sp = .09;
    if (dist <= sp){ a.x = tx; a.y = ty; a.path.shift(); } else { a.x += dx / dist * sp; a.y += dy / dist * sp; }
    a.pose = "walk"; a.facing = (dy < -.01 || (Math.abs(dy) < .01 && dx < 0)) ? "back" : "front";
    return;
  }
  const atSeat = Math.hypot(a.x - seat[0], a.y - seat[1]) < .05;
  a.pose = atSeat && a.sitIdle ? "sit" : "idle"; if (!atSeat) a.facing = "front";
  if (a.mode === "work") return;
  if (--a.wait > 0) return;
  if (Math.random() < .45){ a.sitIdle = true; planTo(a, seat); }
  else { a.sitIdle = false; const s = SPOTS[Math.floor(Math.random() * SPOTS.length)]; planTo(a, [s[0] + (Math.random()-.5)*.5, s[1] + (Math.random()-.5)*.4]); }
  a.wait = 70 + Math.floor(Math.random() * 130);
}

let state = null, hits = [], hoverId = null, tick = 0;
function jobFor(agent){
  const j = state?.job; if (!j?.job || !agent.busy[j.job]) return null;
  if (j.status === "running") return {kind:"busy", text: agent.busy[j.job]};
  const fin = j.finished ? Date.parse(j.finished) : 0;
  if (fin && Date.now() - fin < 3 * 60 * 1000) return j.status === "ok" ? {kind:"ok", text:"Selesai! Cek hasilnya"} : {kind:"err", text:"Gagal, cek log"};
  return null;
}

  if (c){ try { await navigator.clipboard.writeText(c.dataset.copy); const t = c.textContent; c.textContent = "Disalin"; setTimeout(() => c.textContent = t, 1200); } catch { c.textContent = "Gagal menyalin"; } return; }
  const m = e.target.closest("[data-move]");
  if (m){ m.disabled = true; try { await api("/api/video/status", {method:"POST", body: JSON.stringify({slug: m.dataset.slug, status: m.dataset.move})}); } catch(err){ notify(err.message); } await refresh(); renderPanel(true); return; }
  const l = e.target.closest("[data-log]"); if (l){ showLog(l.dataset.log); return; }
  const f = e.target.closest("[data-filter]"); if (f){ filter = f.dataset.filter; renderPanel(true); return; }
  const s = e.target.closest("[data-sort]"); if (s){ const k = s.dataset.sort; sortDir = sortKey === k ? -sortDir : (k === "title" ? 1 : -1); sortKey = k; renderPanel(true); return; }
  if (e.target.id === "btnBible"){ const msg = $("#bibleMsg"); try { msg.textContent = (await api("/api/bible", {method:"POST", body: JSON.stringify({text: $("#bibleText").value})})).message; } catch(err){ msg.textContent = err.message; } }
});

/* ================= refresh ================= */
let refreshTimer;
async function refresh(){
  try { state = await api("/api/state"); }
  catch { $("#greet").textContent = "Server kantor tidak menjawab. Pastikan jendela start_dashboard masih terbuka."; schedule(); return; }
  renderHUD(); renderDock(); renderPanel(false);
  if (viewingLog && state.job.status === "running" && viewingLog === state.job.log) showLog(viewingLog);
  schedule();
}
function schedule(){ clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, state?.job?.status === "running" ? 2500 : 12000); }
refresh();
</script>
