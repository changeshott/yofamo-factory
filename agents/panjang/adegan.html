  // halftone tepi layar (tetap, di luar kamera) — rasa cetakan komik di semua adegan
  (function () {

  function bocorCahaya(tl, warnaA = PINK, warnaB = CY) {

  /* ================================================================ kamera */
  function kameraDorong(tl, dari = 1.0, ke = 1.04, geserX = 0) {
    tl.fromTo(K, { scale: dari, x: 0 }, { scale: ke, x: geserX, duration: dur, ease: "sine.inOut" }, 0);

  function guncang(tl, t, kuat = 14) {

  /* ================================================================ huruf */

  /* ================================================================ host Yofa (gambar AI → PNG, dianimasikan) */
  function host(tl, cx, bawah, tinggi, opsi = {}) {
    const H = D.host || [];
    if (!(H.includes("diam") && H.includes("bicara"))) return maskotSVG(tl, cx - 300, bawah - 760, (tinggi / 760) * 0.95, opsi);
    const ada = (n) => (H.includes(n) ? n : "diam");
    const ek = opsi.ekspresi || "senang";
    const dasar = ada({ senang: "senang", tertawa: "senang", kaget: "kaget", mikir: "mikir", serius: "serius", menunjuk: "menunjuk", diam: "diam" }[ek] || "diam");
    const tunjuk = H.includes("menunjuk") && ek !== "kaget" ? "menunjuk" : null;
    const box = el("div", "host", null, opsi.parent || S, `left:${cx - tinggi / 2}px; top:${bawah - tinggi}px; width:${tinggi}px; height:${tinggi}px; z-index:${opsi.z ?? 8}`);
    const napas = el("div", "lapis", null, box, "transform-origin:50% 100%");
    const badan = el("div", "lapis", null, napas, "transform-origin:50% 92%");
    const dipakai = [...new Set([dasar, "bicara", "diam", tunjuk].filter(Boolean))];
    const I = {};
    dipakai.forEach((n) => { I[n] = el("img", "pose", null, badan); I[n].src = `assets/maskot/${n}.png`; I[n].style.visibility = "hidden"; });
    // jadwal pose: mulut buka (bicara) / tutup (ekspresi adegan) per suku kata; gestur menunjuk saat kata kunci
    const ev = [[0, dasar]];
    const gestur = tunjuk ? (D.kata_kunci || []).slice(0, 2).map((k) => [q(k.a), q(k.a + 1.0)]) : [];
    const diGestur = (t) => gestur.some(([a, b]) => t >= a && t < b);
    (opsi.kata || []).forEach((k) => {
      const a = q(k.a), b = q(Math.max(k.a + 2 / FG, k.b));
      const suku = Math.max(1, Math.min(4, (String(k.t).match(/[aiueoAIUEO]+/g) || []).length));
      const len = (b - a) / suku;
      for (let i = 0; i < suku; i++) {
        const t = q(a + i * len);
        ev.push([t, diGestur(t) ? tunjuk : "bicara"]);
        if (len >= 3 / FG) ev.push([q(t + len * 0.6), diGestur(t) ? tunjuk : dasar]);
      }
      ev.push([b, diGestur(b) ? tunjuk : dasar]);
    });
    gestur.forEach(([a, b]) => { ev.push([a, tunjuk]); ev.push([b, dasar]); });
    const urut = ev.map((e, i) => [...e, i]).sort((x, y) => x[0] - y[0] || x[2] - y[2]);
    const akhir = new Map(); urut.forEach(([t, n]) => akhir.set(t.toFixed(3), n));
    let sebelum = null;
    [...akhir.entries()].sort((x, y) => +x[0] - +y[0]).forEach(([t, n]) => {
      if (n === sebelum) return; sebelum = n;
      for (const k in I) tl.set(I[k], { visibility: k === n ? "visible" : "hidden" }, +t);
    });
    // badan bernapas, bergoyang pelan, kepala mengangguk tiap awal kalimat (semua on twos)
    const np = 1.7, ulang = Math.max(0, Math.floor(dur / np) - 1);
    tl.fromTo(napas, { scaleY: 1, scaleX: 1 }, { scaleY: 1.016, scaleX: 0.994, duration: np, ease: dua(np), yoyo: true, repeat: ulang }, 0);
    tl.fromTo(box, { x: -7 }, { x: 7, duration: 2.6, ease: dua(2.6), yoyo: true, repeat: Math.max(0, Math.floor(dur / 2.6) - 1) }, 0);
    (opsi.kalimat || []).forEach((k, i) => {
      const s = i % 2 ? -1 : 1, t = q(k.a);
      tl.to(badan, { rotation: s * 2.4, y: -18, scaleY: 1.02, duration: 2 / FG, ease: "steps(2)" }, t);
      tl.to(badan, { rotation: s * 0.6, y: 0, scaleY: 1, duration: 4 / FG, ease: "steps(4)" }, q(t + 2 / FG));
    });
    if (opsi.masuk !== false) {
      tl.fromTo(box, { y: tinggi * 0.45, scaleY: 1.1, scaleX: 0.92 }, { y: -tinggi * 0.03, scaleY: 0.96, scaleX: 1.04, duration: 4 / FG, ease: "steps(4)" }, q(0.08));
      tl.to(box, { y: 0, scaleY: 1, scaleX: 1, duration: 2 / FG, ease: "steps(2)" }, q(0.08 + 4 / FG));
    }
    return box;
  }

  function maskotSVG(tl, x, y, skala, opsi = {}) {
    const box = el("div", "maskot", document.getElementById("tplMaskot").innerHTML, opsi.parent || S, `left:${x}px; top:${y}px; transform: scale(${skala}); z-index:${opsi.z ?? 8}`);

    const kel = svg.querySelector(".kelopak"), bola = svg.querySelector(".bolamata"), alisL = svg.querySelector(".alisL"), alisR = svg.querySelector(".alisR");
    const ekspresi = opsi.ekspresi || "senang";
    const diam = { senang: "senyum", kaget: "o", tertawa: "buka" }[ekspresi] || "tutup";
    const bentuk = (t, nama) => { for (const k in M) tl.set(M[k], { visibility: k === nama ? "visible" : "hidden" }, t); };
    bentuk(0, diam);
    const EK = { senang: [-4, 0, 0, 0], kaget: [-16, -14, 0, 0], mikir: [6, -14, 10, -6], serius: [8, 8, 0, 0], tertawa: [-8, -6, 0, 0] }[ekspresi] || [0, 0, 0, 0];
    gsap.set(alisL, { y: EK[0] }); gsap.set(alisR, { y: EK[1] }); gsap.set(bola, { x: EK[2], y: EK[3] });
    (opsi.kata || []).forEach((k) => {
      const a = q(k.a), b = q(Math.max(k.a + 1 / FG, k.b));
      const suku = Math.max(1, Math.min(4, (String(k.t).match(/[aiueoAIUEO]+/g) || []).length)), len = (b - a) / suku;
      for (let i = 0; i < suku; i++) { const t = q(a + i * len), vok = (String(k.t).match(/[aiueoAIUEO]/g) || ["a"])[i] || "a"; bentuk(t, /[ou]/i.test(vok) ? "o" : i % 2 ? "kecil" : "buka"); if (len > 2 / FG) bentuk(q(t + len * 0.55), "kecil"); }

    return box;
  }

  /* ================================================================ transisi masuk (tutup layar → terbuka) */
  function transisiMasuk(tl) {
    const jenis = D.transisi || "halftone", wp = document.getElementById("wipe");
    if (jenis === "potong") { wp.style.display = "none"; return; }
    const warna = (D.seed || 0) % 2 ? TINTA : PINK;
    if (jenis === "halftone" || jenis === "iris") {
      const g = sv("g", {}, wp), jar = 120;
      for (let i = 0; i <= 16; i++) for (let j = 0; j <= 9; j++) {
        const c = sv("circle", { cx: i * jar, cy: j * jar, r: 92, fill: warna }, g);
        tl.fromTo(c, { attr: { r: 92 } }, { attr: { r: 0 }, duration: 0.25, ease: "steps(3)", immediateRender: true }, q(0.04 + (i + j) * 0.016));
      }
    } else if (jenis === "cipratan" || jenis === "bintang") {
      const m = sv("mask", { id: "mw" }, sv("defs", {}, wp));
      sv("rect", { width: 1920, height: 1080, fill: "white" }, m);
      const r = rng((D.seed || 1) * 13), n = 20, p = [];
      for (let i = 0; i < n; i++) { const a = (i / n) * 6.2832, rr = r() < 0.3 ? 1.3 + r() * 0.4 : 0.8 + r() * 0.2; p.push(`${(Math.cos(a) * rr).toFixed(3)},${(Math.sin(a) * rr).toFixed(3)}`); }
      const lub = sv("polygon", { points: p.join(" "), fill: "black", "stroke-linejoin": "round" }, m);
      sv("rect", { width: 1920, height: 1080, fill: warna, mask: "url(#mw)" }, wp);
      const o = { s: 0.01, r: 0 };
      lub.setAttribute("transform", "translate(960 540) scale(0.01)");
      tl.to(o, { s: 1500, r: 40, duration: 0.5, ease: "steps(6)", onUpdate: () => lub.setAttribute("transform", `translate(960 540) rotate(${o.r}) scale(${o.s})`) }, 0.02);
    } else {  // sobek: layar terbelah diagonal bergerigi lalu ditarik ke dua arah
      const gigi = Array.from({ length: 13 }, (_, i) => `${(i * 170).toFixed(0)},${(1180 - i * 108 + (i % 2 ? 40 : -40)).toFixed(0)}`).join(" ");
      const a = sv("polygon", { points: `-200,-200 2300,-200 ${gigi.split(" ").reverse().join(" ")}`, fill: warna, stroke: KU, "stroke-width": 14 }, wp);
      const b = sv("polygon", { points: `${gigi} 2300,1300 -200,1300`, fill: warna === PINK ? TINTA : PINK, stroke: KU, "stroke-width": 14 }, wp);
      tl.fromTo(a, { x: 0, y: 0 }, { x: -1400, y: -900, duration: 0.42, ease: "steps(5)" }, 0.06);
      tl.fromTo(b, { x: 0, y: 0 }, { x: 1400, y: 900, duration: 0.42, ease: "steps(5)" }, 0.06);
    }
    tl.set(wp, { autoAlpha: 0 }, 0.75);
  }

  /* tampil mulai t: disembunyikan sejak awal lalu tl.set — aman walau renderer melompat ke akhir lalu kembali ke awal

  /* ================================================================ adegan */
  function bangun() {

    const J = D.jenis, rr = rng((D.seed || 1) * 101);

      const ke = { zoom: { scale: 1.17, x: 0, y: -10 }, kiri: { scale: 1.16, x: -70, y: 0 }, kanan: { scale: 1.16, x: 70, y: 0 }, naik: { scale: 1.16, x: 0, y: -46 } }[g] || { scale: 1.17 };
      let wadah;

        tl.fromTo(wadah, { scale: 0.55, rotation: -9 }, { scale: 1.03, rotation: -1, duration: 4 / FG, ease: "steps(4)" }, q(0.05));

      if (D.teks_layar && D.ilustrasi) {

        nb.style.fontSize = pas(D.teks_layar, 50, 30, kecil ? 1900 : 2300) + "px";
        const t0 = q(Math.min(1.2, dur / 3));
        muncul(tl, nb, t0);
        tl.fromTo(nb, { y: 180, rotation: 4 }, { y: -10, rotation: -1.2, duration: 3 / FG, ease: "steps(3)" }, t0);
        tl.to(nb, { y: 0, duration: 2 / FG, ease: "steps(2)" }, q(t0 + 3 / FG));

      kataKunci(tl, kecil ? 1500 : 1560, 150, 560, 150);

    } else if (J === "diagram") {
      diagram(tl, rr);
    } else if (J === "thumbnail") {
      lukisLatar({ cahaya: [520, 420], cipratan: [{ x: 430, y: 480, r: 430, warna: CY }, { x: 1700, y: 900, r: 260, warna: KU }, { x: 900, y: 120, r: 160, warna: UN }], nKuas: 40 });
      if (D.ilustrasi) {
        const p = el("div", "panel", null, S, "left:860px; top:70px; width:990px; height:600px; transform: rotate(2.5deg); z-index:6");
        gambar(D.ilustrasi, "", p, "transform: scale(1.06)");
      }
      host(tl, 470, 1130, 1160, { ekspresi: D.ekspresi || "kaget", masuk: false, z: 10 });
      const kata = String(D.judul || "").toUpperCase().split(/\s+/).filter(Boolean);
      const atas = kata.slice(0, Math.ceil(kata.length / 2)).join(" "), bawah = kata.slice(Math.ceil(kata.length / 2)).join(" ");
      [[atas, KR, 640], [bawah, KU, 830]].forEach(([t, c, y]) => {
        if (!t) return;
        const e = cetak(S, t, `left:820px; right:40px; top:${y}px; text-align:center; z-index:30; transform: rotate(-3deg)`, c);
        e.style.fontSize = pas(t, 200, 80, 1040) + "px";
      });
    } else if (J === "judul_bab") {
      const dasar = [PINK, UN, BI, PINK][(D.nomor || 1) % 4];
      lukisLatar({ warna: dasar, cahaya: [960, 520], cipratan: [{ x: 420, y: 520, r: 420, warna: KU, alpha: 0.95 }, { x: 1600, y: 260, r: 240, warna: CY }, { x: 1500, y: 930, r: 170, warna: PM }], nKuas: 44,
        halftone: [[0, 1080, 900, TINTA, 0.55], [1920, 0, 700, KR, 0.3]] });
      const s = el("div", "sinar", null, S, `background: repeating-conic-gradient(from 0deg, ${KR} 0deg 7deg, transparent 7deg 18deg);`);
      tl.fromTo(s, { rotation: 0 }, { rotation: 18 * dur / 6, duration: dur, ease: "none" }, 0);
      bocorCahaya(tl, KU, CY);
      const no = el("div", "angka-ht", String(D.nomor || 1).padStart(2, "0"), S, "left:150px; top:200px; font-size:520px; z-index:15; transform: rotate(-6deg)");
      const bab = cetak(S, "BAB", "left:190px; top:120px; font-size:96px; z-index:20; transform: rotate(-6deg)", KR);
      const jd = cetak(S, D.judul || "", "left:820px; right:90px; top:330px; z-index:20; transform: rotate(-3deg)", KU);
      jd.style.fontSize = pas(D.judul || "", 150, 66, 1000 * 2.2) + "px";
      muncul(tl, no, q(0.3));
      tl.fromTo(no, { scale: 2.6, rotation: -30 }, { scale: 0.94, rotation: -5, duration: 4 / FG, ease: "steps(4)" }, q(0.3));
      tl.to(no, { scale: 1, rotation: -6, duration: 2 / FG, ease: "steps(2)" }, q(0.3 + 4 / FG));
      guncang(tl, 0.3 + 4 / FG, 22);
      tl.fromTo(bab, { y: -320 }, { y: 0, duration: 4 / FG, ease: "steps(4)" }, q(0.45));
      tl.fromTo(jd, { x: 1200, skewX: -18 }, { x: -20, skewX: 4, duration: 4 / FG, ease: "steps(4)" }, q(0.62));
      tl.to(jd, { x: 0, skewX: 0, duration: 2 / FG, ease: "steps(2)" }, q(0.62 + 4 / FG));
      getar(tl, jd, 1.2, dur);
      kameraDorong(tl, 1.0, 1.07);
    }
    if (J !== "thumbnail") transisiMasuk(tl); else { document.getElementById("wipe").style.display = "none"; }
    window.__timelines["main"] = tl;
  }

  /* ================================================================ diagram & motion graphic */
  function diagram(tl, rr) {
    const G = D.diagram || {}, tipe = G.tipe || "bagian";
    lukisLatar({ warna: KR, cahaya: [960, 520], kuas: [geser(KR, -0.05), PM, geser(KR, -0.1), geser(PM, 0.4)], nKuas: 26,
      halftone: [[0, 1080, 760, PINK, 0.45, 26], [1920, 0, 560, CY, 0.4, 26]],
      cipratan: [{ x: 1830, y: 980, r: 190, warna: CY, alpha: 0.9 }, { x: 70, y: 120, r: 120, warna: KU }],
      sapuan: G.judul ? [{ x: 600, y: 112, panjang: Math.min(1500, 260 + String(G.judul).length * 42), lebar: 130, warna: PINK, sudut: -0.03 }] : [], butir: 12 });
    bocorCahaya(tl, PM, CY);
    kameraDorong(tl, 1.0, 1.03);
    if (G.judul) {
      const j = cetak(S, G.judul, "left:90px; top:60px; z-index:20; transform: rotate(-2deg)", KR);
      j.style.fontSize = pas(G.judul, 84, 46, 1650) + "px";
      tl.fromTo(j, { x: -1000 }, { x: 14, duration: 4 / FG, ease: "steps(4)" }, q(0.3));
      tl.to(j, { x: 0, duration: 2 / FG, ease: "steps(2)" }, q(0.3 + 4 / FG));
    }
    const waktu = (n) => {
      const ks = D.kalimat || [];
      return Array.from({ length: n }, (_, i) => q(Math.min(Math.max(0.5, dur - 1.0), ks.length >= n ? ks[Math.min(ks.length - 1, i + (ks.length > n ? 1 : 0))].a : 0.8 + (i * (dur - 1.6)) / Math.max(1, n))));
    };
    const warna = [PINK, CY, KU, OR, HI, UN];
    const svgLapis = () => { const l = el("div", "lapis", null, S, "z-index:12"); return sv("svg", { viewBox: "0 0 1920 1080", width: 1920, height: 1080 }, l); };
    const garisKuas = (svg, d, t, lebar = 11) => {
      const ps = [sv("path", { d, stroke: TINTA, "stroke-width": lebar + 8, "stroke-linecap": "round", fill: "none", "stroke-dasharray": 1600, "stroke-dashoffset": 1600 }, svg),
                  sv("path", { d, stroke: PINK, "stroke-width": lebar - 3, "stroke-linecap": "round", fill: "none", "stroke-dasharray": 1600, "stroke-dashoffset": 1600 }, svg)];
      ps.forEach((p) => tl.to(p, { attr: { "stroke-dashoffset": 0 }, duration: 4 / FG, ease: "steps(4)" }, t));
    };
    if (tipe === "bagian") {
      const bag = (G.bagian || []).slice(0, 6), t = waktu(bag.length);
      const cx = 960, cy = 590;
      let pusat;
      if (D.objek) {
        pusat = gambar(D.objek, "objek", S, `left:${cx - 300}px; top:${cy - 300}px; width:600px; height:600px; z-index:14`);
        tl.fromTo(pusat, { y: -10, rotation: -1.5 }, { y: 10, rotation: 1.5, duration: 1.5, ease: dua(1.5), yoyo: true, repeat: Math.max(0, Math.floor(dur / 1.5) - 1) }, 0.9);
      } else {
        pusat = el("div", "panel", null, S, `left:${cx - 250}px; top:${cy - 250}px; width:500px; height:500px; border-radius:50%; z-index:14; background:${KR}`);
        if (D.ilustrasi) { const im = gambar(D.ilustrasi, "", pusat); tl.fromTo(im, { scale: 1 }, { scale: 1.12, duration: dur, ease: "sine.inOut" }, 0); }
        else cetak(pusat, G.pusat || "?", "left:0; right:0; top:190px; text-align:center; font-size:64px", KU);
      }
      // lingkaran cat di belakang objek
      const halo = el("div", "lapis", null, S, `z-index:11; left:${cx - 330}px; top:${cy - 330}px; width:660px; height:660px; border-radius:50%; background: radial-gradient(circle, ${rgba(CY, 0.55)} 0 55%, ${rgba(CY, 0)} 70%)`);
      tl.fromTo(halo, { scale: 0 }, { scale: 1, duration: 4 / FG, ease: "steps(4)" }, q(0.3));
      tl.fromTo(pusat, { scale: 0.1, rotation: -25 }, { scale: 1.08, rotation: 2, duration: 4 / FG, ease: "steps(4)" }, q(0.35));
      tl.to(pusat, { scale: 1, rotation: 0, duration: 2 / FG, ease: "steps(2)" }, q(0.35 + 4 / FG));
      const svg = svgLapis();
      const pos = D.host_kecil ? [[-545, -210], [545, -210], [-575, 110], [545, 50], [-450, 330], [0, 395]]
                               : [[-545, -210], [545, -210], [-575, 110], [575, 110], [-450, 330], [450, 330]];
      bag.forEach((b, i) => {
        const [dx, dy] = pos[i], lx = cx + dx, ly = cy + dy, a = Math.atan2(dy, dx);
        const ax = cx + Math.cos(a) * 220, ay = cy + Math.sin(a) * 220;
        garisKuas(svg, `M${ax.toFixed(0)} ${ay.toFixed(0)} Q${((ax + lx) / 2).toFixed(0)} ${(ly - 40).toFixed(0)} ${(lx - Math.sign(dx) * 30).toFixed(0)} ${ly}`, t[i], 10);
        const titik = sv("circle", { cx: ax, cy: ay, r: 17, fill: KU, stroke: TINTA, "stroke-width": 7, opacity: 0 }, svg);
        tl.set(titik, { attr: { opacity: 1 } }, t[i]);
        const lbl = el("div", "label", `${esc(b.label)}${b.ket ? `<small>${esc(b.ket)}</small>` : ""}`, S,
          `z-index:20; top:${ly - 52}px; ${dx < 0 ? `right:${1920 - lx}px` : `left:${lx}px`}; --warna:${warna[i % warna.length]}; transform: rotate(${i % 2 ? 1.5 : -1.5}deg); max-width:400px; white-space:normal`);
        if (dx === 0) gsap.set(lbl, { xPercent: -50 });
        muncul(tl, lbl, q(t[i] + 0.25));
        tl.fromTo(lbl, { scale: 0.2 }, { scale: 1.1, duration: 3 / FG, ease: "steps(3)" }, q(t[i] + 0.25));
        tl.to(lbl, { scale: 1, duration: 2 / FG, ease: "steps(2)" }, q(t[i] + 0.25 + 3 / FG));
      });
    } else if (tipe === "alur") {
      const lk = (G.langkah || []).slice(0, 5), t = waktu(lk.length), n = lk.length;
      const lebar = Math.min(380, (D.host_kecil ? 1330 : 1700) / Math.max(1, n) - 40);
      const svg = svgLapis();
      lk.forEach((s, i) => {
        const x = 110 + i * (lebar + 40), y = 340 + (i % 2) * 150;
        const k = el("div", "kartu", `<div class="bulat" style="margin:-8px 0 14px -6px; background:${warna[i % warna.length]}">${i + 1}</div><div class="besar">${esc(s)}</div>`, S,
          `left:${x}px; top:${y}px; width:${lebar}px; z-index:20`);
        k.querySelector(".besar").style.fontSize = Math.max(30, Math.min(50, (1400 / Math.max(10, s.length)) * (lebar / 380))) + "px";
        muncul(tl, k, t[i]);
        tl.fromTo(k, { y: -420, rotation: -12 }, { y: 14, rotation: i % 2 ? 3 : -3, duration: 4 / FG, ease: "steps(4)" }, t[i]);
        tl.to(k, { y: 0, rotation: i % 2 ? 2 : -2, duration: 2 / FG, ease: "steps(2)" }, q(t[i] + 4 / FG));
        if (i < n - 1) {
          const x1 = x + lebar - 10, y1 = y + (i % 2 ? 40 : 230), x2 = x + lebar + 52, y2 = 340 + ((i + 1) % 2) * 150 + (i % 2 ? 230 : 40);
          garisKuas(svg, `M${x1} ${y1} Q${(x1 + x2) / 2 + 30} ${(y1 + y2) / 2} ${x2} ${y2}`, q(t[i] + 0.35), 9);
        }
      });
    } else if (tipe === "perbandingan") {
      const kol = [G.kiri || {}, G.kanan || {}], t = waktu(2);
      kol.forEach((c, i) => {
        const k = el("div", "kartu", `<div class="kecil">${esc(c.label || "")}</div><div class="besar">${esc(c.nilai || "")}</div><div class="ket">${esc(c.ket || "")}</div>`, S,
          `left:${i ? 1010 : 150}px; top:250px; width:760px; min-height:440px; z-index:20; background:${i ? KU : KR}; transform: rotate(${i ? 1.5 : -1.5}deg)`);
        k.querySelector(".besar").style.fontSize = pas(String(c.nilai || ""), 150, 60, 660) + "px";
        muncul(tl, k, t[i]);
        tl.fromTo(k, { x: i ? 1000 : -1000 }, { x: i ? -16 : 16, duration: 4 / FG, ease: "steps(4)" }, t[i]);
        tl.to(k, { x: 0, duration: 2 / FG, ease: "steps(2)" }, q(t[i] + 4 / FG));
      });
      const vs = el("div", "stiker", null, S, "left:960px; top:520px; z-index:25");
      ledakan(sv("svg", { width: 10, height: 10 }, vs), rr, 110, PINK);
      cetak(vs, "VS", "left:-78px; top:-62px; font-size:120px", KU);
      tl.fromTo(vs, { scale: 0, rotation: -40 }, { scale: 1, rotation: -6, duration: 4 / FG, ease: "steps(4)" }, q(t[1] - 0.2));
      guncang(tl, t[1] - 0.2 + 4 / FG, 14);
    } else if (tipe === "angka") {
      const t = waktu(1)[0];
      const box = el("div", "kartu", `<div class="kecil">${esc(G.label_atas || "faktanya")}</div><div class="besar"><span class="n">0</span><span style="font-size:.42em">${esc(G.akhiran || "")}</span></div><div class="ket" style="font-size:40px">${esc(G.label || "")}</div>`, S,
        `left:310px; top:240px; width:1300px; z-index:20; text-align:center; background:${KU}`);
      const nEl = box.querySelector(".n");
      box.querySelector(".besar").style.fontSize = pas(String(G.angka || "") + (G.akhiran || ""), 260, 100, 1100) + "px";
      tl.fromTo(box, { scale: 0.2, rotation: 14 }, { scale: 1.06, rotation: -2, duration: 4 / FG, ease: "steps(4)" }, t);
      tl.to(box, { scale: 1, rotation: -1.5, duration: 2 / FG, ease: "steps(2)" }, q(t + 4 / FG));
      guncang(tl, t + 4 / FG, 16);
      const s = String(G.angka || "0"), target = Number(s.replace(/\./g, "").replace(",", ".")), des = s.includes(","), o = { v: 0 };
      if (isFinite(target)) tl.to(o, { v: target, duration: Math.min(1.6, dur * 0.4), ease: "steps(14)", onUpdate: () => { nEl.textContent = des ? o.v.toFixed(1).replace(".", ",") : Math.round(o.v).toLocaleString("id-ID"); } }, q(t + 0.3));
      else nEl.textContent = s;
    } else if (tipe === "daftar" || tipe === "timeline") {
      const it = (G.butir || []).slice(0, 5), t = waktu(it.length);
      it.forEach((b, i) => {
        const teks = typeof b === "string" ? b : `${b.waktu ? b.waktu + " — " : ""}${b.teks || ""}`;
        const row = el("div", "baris", `<div class="bulat" style="background:${warna[i % warna.length]}">${tipe === "timeline" && b.waktu ? "★" : i + 1}</div><div class="label" style="position:relative; font-size:44px; --warna:${warna[(i + 2) % warna.length]}">${esc(teks)}</div>`, S,
          `left:${190 + i * 40}px; top:${230 + i * 150}px; z-index:20`);
        muncul(tl, row, t[i]);
        tl.fromTo(row, { x: -1300 }, { x: 18, duration: 4 / FG, ease: "steps(4)" }, t[i]);
        tl.to(row, { x: 0, duration: 2 / FG, ease: "steps(2)" }, q(t[i] + 4 / FG));
      });
    }
    if (D.host_kecil) {  // host di bingkai bulat pojok kanan bawah (gaya "talking head" komik), tidak menutupi diagram
      const w = el("div", "inset", null, S, "left:1545px; top:705px; width:340px; height:340px; z-index:22");
      tl.fromTo(w, { scale: 0, rotation: -25 }, { scale: 1.1, rotation: 4, duration: 4 / FG, ease: "steps(4)" }, q(0.45));
      tl.to(w, { scale: 1, rotation: 0, duration: 2 / FG, ease: "steps(2)" }, q(0.45 + 4 / FG));
      host(tl, 170, 560, 600, { kata: D.kata, kalimat: D.kalimat, ekspresi: D.ekspresi, parent: w, masuk: false });
    }
  }

  const siap = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('900 100px "Yofamo"'), document.fonts.load('800 40px "YofamoXB"')]) : Promise.resolve();
  const gambarSiap = () => Promise.all([...document.images].map((i) => (i.complete ? 1 : new Promise((r) => { i.onload = i.onerror = r; }))));
  siap.then(bangun, bangun).then(gambarSiap);
})();
</script>
</body>
</html>
